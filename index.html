<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div id="header">
        <h1>My Library</h1>
    </div>

    <div id="side-bar">
        <h2>Sidebar!</h2>
        <div id="new-book-form" hidden="hidden">
            <form>
                <h3>Add book</h3>
                <div>
                    <label for="book-title">Title</label>
                    <input type="text" id="book-title" name="book_title">
                </div>
                <div>
                    <label for="book-author">Author</label>
                    <input type="text" id="book-author" name="book_author">
                </div>
                <div>
                    <label for="book-page-count">Page Count</label>
                    <input type="number" id="book-page-count" name="book_page_count">
                </div>
                <div>
                    <label for="btn-book-read">Read</label>
                    <button id="btn-book-read">✖</button>
                </div>
                <button id="btn-add-book">Add Book</button>
            </form>
        </div>
         <div id="new-book-btn-div">
            <button id="btn-new-book">New Book</button>
        </div>
    </div>

    <div id="bookshelf">

    </div>

    <div id="footer">
        <p>Heh... This website was made by nicwpac.</p>
    </div>
</body>
</html>
